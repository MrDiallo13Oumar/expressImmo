<div class="content-body">
  <div class="container-fluid">
    <div class="card shadow-sm rounded p-4 mt-3 border-0">
      <div class="card-body d-flex align-items-center justify-content-between">
        <h4 class="card-title fw-bold text-dark mb-0">
          <mat-icon class="me-2 text-primary">home</mat-icon> Type De Propriétés
        </h4>
        <button
          mat-raised-button
          color="accent"
          class="d-flex align-items-center"
         routerLink="/propriete/type-propriete"
        >
          <mat-icon class="me-2">add</mat-icon>
          Nouveau Type de Propriété
        </button>
      </div>
    </div>
    <div class="row">

      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <div class="card-title text-center">
              <h4>Modifier Le Type de Propriété</h4>
            </div>
            <form [formGroup]="typePropriete">
              <div class="row">
                <div class="mb-3 w-100">
                  <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Libellé</mat-label>
                    <input matInput placeholder="Entrer le libellé" formControlName="libelle" [value]="infoTypePropriete?.libelle" />
                  </mat-form-field>
                </div>
              </div>
            </form>
          </div>
          <div class="card-footer">
            <div class="d-flex justify-content-center">
              <button mat-raised-button color="primary" class="mt-3" (click)="confirmEditing(typePropriete)">Modifier</button>
            </div>
          </div>
        </div>
      </div>



  <div class="col-md-6">
    <mat-card>
      <mat-card-header>
      </mat-card-header>
      <mat-card-content>
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>Rechercher...</mat-label>
          <input
            matInput
            (keyup)="applyFilter($event)"
            placeholder="Rechercher"
            #input
          />
        </mat-form-field>
        <table
          mat-table
          [dataSource]="dataSource"
          class="mat-elevation-z8"
          style="width: 100%"
          id="maTable"
        >
          <!-- ID Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let i = index">{{ i + 1 }}</td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="libelle">
            <th mat-header-cell *matHeaderCellDef>Libelle</th>
            <td mat-cell *matCellDef="let element">
              {{ element.libelle }}
            </td>
          </ng-container>







          <!-- Header and Row Declarations -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <!-- Paginator -->
        <mat-paginator
          [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons
        ></mat-paginator>
      </mat-card-content>
    </mat-card>
  </div>
</div>
</div>
</div>
